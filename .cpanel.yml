- echo "Starting deployment process..." > /home/jayant/tempo/deploy.log
- DEPLOYPATH=/home/jayant/tempo/current
- mkdir -p $DEPLOYPATH
- /bin/cp -R --preserve=mode,timestamps --no-dereference . $DEPLOYPATH >> /home/jayant/tempo/deploy.log 2>&1
- if [ -f ".env" ]; then /bin/cp .env $DEPLOYPATH/.env >> /home/jayant/tempo/deploy.log 2>&1; else echo ".env not in repo — create $DEPLOYPATH/.env via cPanel" >> /home/jayant/tempo/deploy.log 2>&1; fi
- if [ ! -d "$DEPLOYPATH/venv" ]; then python3 -m venv $DEPLOYPATH/venv >> /home/jayant/tempo/deploy.log 2>&1 || python -m venv $DEPLOYPATH/venv >> /home/jayant/tempo/deploy.log 2>&1; fi
- source $DEPLOYPATH/venv/bin/activate && pip install --upgrade pip setuptools wheel >> /home/jayant/tempo/deploy.log 2>&1
- source $DEPLOYPATH/venv/bin/activate && pip install -r $DEPLOYPATH/requirements.txt >> /home/jayant/tempo/deploy.log 2>&1
- source $DEPLOYPATH/venv/bin/activate && cd $DEPLOYPATH && set -a && . $DEPLOYPATH/.env && set +a && python manage.py migrate --noinput >> /home/jayant/tempo/deploy.log 2>&1
- source $DEPLOYPATH/venv/bin/activate && cd $DEPLOYPATH && python manage.py collectstatic --noinput >> /home/jayant/tempo/deploy.log 2>&1
- mkdir -p $DEPLOYPATH/tmp && touch $DEPLOYPATH/tmp/restart.txt >> /home/jayant/tempo/deploy.log 2>&1
