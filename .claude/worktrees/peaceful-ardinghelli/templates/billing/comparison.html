<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Data Comparison Tool</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --diff-bg: #fee2e2;
            --diff-text: #b91c1c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        /* HEADER & CONTROLS */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        h1 { margin: 0; font-size: 1.5rem; }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) { opacity: 0.9; }

        /* TICKET METADATA CARD */
        .ticket-meta {
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        
        .meta-item label {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }
        
        .meta-item span { font-weight: 600; color: var(--text); }

        .badge {
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-linked { background: #dcfce7; color: #15803d; }
        .badge-missing { background: #fee2e2; color: #b91c1c; }

        /* COMPARISON TABLE */
        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #475569;
            position: sticky;
            top: 0;
        }

        /* Highlight Logic */
        tr.diff-row td { background-color: #fff1f2; }
        tr.diff-row td.value-cell { color: var(--diff-text); font-weight: 600; }
        
        .field-col { width: 20%; color: #64748b; font-family: monospace; }
        .data-col { width: 40%; }

        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 1.1rem;
        }
        .error-msg { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Ticket Comparison Tool</h1>
                <div id="counter" style="color: #64748b; font-size: 0.9rem; margin-top: 4px;">Initialize...</div>
            </div>
            <div class="controls">
                <button id="btn-prev" onclick="changePage(-1)" disabled>Previous</button>
                <button id="btn-next" onclick="changePage(1)" disabled>Next</button>
            </div>
        </header>

        <div id="app-content">
            <div class="loading">Fetching Data...</div>
        </div>
    </div>

    <script>
        // --- GLOBAL STATE ---
        const APP = {
            finalTickets: [],
            initialMap: new Map(), // Initial UUID -> Data Object
            currentIndex: 0
        };

        // --- 1. DATA FETCHING ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Fetch both endpoints concurrently
                const [finalRes, initialRes] = await Promise.all([
                    fetch('/billing/api/final-data/'),
                    fetch('/billing/api/initial-data/')
                ]);

                if (!finalRes.ok || !initialRes.ok) throw new Error("API Error: Failed to fetch data.");

                const finalData = await finalRes.json();
                const initialData = await initialRes.json();

                if (finalData.success) APP.finalTickets = finalData.data || [];
                
                // Index Initial Tickets for fast lookup
                if (initialData.success && Array.isArray(initialData.data)) {
                    initialData.data.forEach(t => APP.initialMap.set(t.uuid, t));
                }

                render();
            } catch (err) {
                document.getElementById('app-content').innerHTML = `<div class="error-msg">${err.message}</div>`;
            }
        });

        // --- 2. RENDERING LOGIC ---
        function render() {
            const container = document.getElementById('app-content');
            const counter = document.getElementById('counter');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            if (APP.finalTickets.length === 0) {
                container.innerHTML = `<div class="loading">No Final Tickets Found.</div>`;
                return;
            }

            // Get Current Record
            const finalTicket = APP.finalTickets[APP.currentIndex];
            const initialTicket = finalTicket.initial_ticket_uuid 
                ? APP.initialMap.get(finalTicket.initial_ticket_uuid) 
                : null;

            // Update Controls
            counter.innerText = `Record ${APP.currentIndex + 1} of ${APP.finalTickets.length}`;
            btnPrev.disabled = APP.currentIndex === 0;
            btnNext.disabled = APP.currentIndex === APP.finalTickets.length - 1;

            // Prepare Table Data
            const finalTableData = finalTicket.data_table || {};
            const initialTableData = initialTicket ? (initialTicket.data_table || {}) : {};

            // Merge keys to show all fields
            const allKeys = new Set([...Object.keys(finalTableData), ...Object.keys(initialTableData)]);
            const sortedKeys = Array.from(allKeys).filter(k => !k.startsWith('_')).sort(); // Hide meta fields

            // Build HTML
            let html = `
                <div class="ticket-meta">
                    <div class="meta-item">
                        <label>Ticket Number</label>
                        <span>${finalTicket.ticket_number || 'N/A'}</span>
                    </div>
                    <div class="meta-item">
                        <label>Request ID</label>
                        <span>${finalTicket.request_id || 'N/A'}</span>
                    </div>
                    <div class="meta-item">
                        <label>Link Status</label>
                        ${initialTicket 
                            ? `<span class="badge badge-linked">Linked</span>` 
                            : `<span class="badge badge-missing">Unlinked</span>`}
                    </div>
                    <div class="meta-item">
                        <label>Rate Card / Band</label>
                        <span>${finalTicket.band ? (finalTicket.band.ticket_number || 'Assigned') : 'None'}</span>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th class="field-col">Field Name</th>
                                <th class="data-col">Initial Data (Raw)</th>
                                <th class="data-col">Final Data (Processed)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            sortedKeys.forEach(key => {
                const initVal = initialTableData[key] !== undefined ? String(initialTableData[key]) : '';
                const finalVal = finalTableData[key] !== undefined ? String(finalTableData[key]) : '';
                
                // Diff Check (Simple String Comparison)
                const isDiff = initVal.trim() !== finalVal.trim();
                const rowClass = isDiff ? 'diff-row' : '';

                html += `
                    <tr class="${rowClass}">
                        <td class="field-col">${key}</td>
                        <td class="value-cell">${initVal || '<em style="color:#ccc">null</em>'}</td>
                        <td class="value-cell">${finalVal || '<em style="color:#ccc">null</em>'}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        // --- 3. CONTROLS ---
        function changePage(direction) {
            const newIndex = APP.currentIndex + direction;
            if (newIndex >= 0 && newIndex < APP.finalTickets.length) {
                APP.currentIndex = newIndex;
                render();
            }
        }

    </script>
</body>
</html>
